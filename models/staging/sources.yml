version: 2

sources:
  - name: olist
    database: olist-dbt-analytics
    schema: raw
    tables:
      - name: raw_customers
        description: "Customer data including unique identifiers and location details. Each row represents a unique order-customer relationship."
      - name: raw_geolocation
        description: "Brazilian zip code geolocation data with latitude, longitude, city and state. Used to map customer and seller locations."
      - name: raw_orders
        description: "Core orders table containing order status, timestamps for purchase, approval, delivery and estimated delivery dates."
      - name: raw_order_items
        description: "Individual items within each order including product, seller, price and freight value. One row per item per order."
      - name: raw_order_payments
        description: "Payment transactions per order including payment method, installments and transaction value. One order can have multiple payment rows."
      - name: raw_order_reviews
        description: "Customer reviews submitted after order delivery including review score, title and comment text."
      - name: raw_products
        description: "Product catalogue with category, dimensions and weight. Category names are in Portuguese and require translation."
      - name: raw_sellers
        description: "Seller data including unique identifier and location details such as zip code, city and state."
      - name: raw_product_category_name_translation
        description: "Mapping table translating Portuguese product category names to English equivalents."