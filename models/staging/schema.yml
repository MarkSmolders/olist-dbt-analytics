version: 2

# -------------------------------------------------------
# Staging model: stg_olist__customers
# -------------------------------------------------------
models:
  - name: stg_olist__customers
    description: "Staging model for the Olist customers table. One row per order-customer relationship. Note that the same physical customer will have a different customer_id per order — use customer_unique_id to identify returning customers."
    columns:
      - name: customer_id
        description: "Unique identifier for each order-customer relationship. Primary key of this model."
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier for the physical customer across all orders. Use this to identify returning customers."
      - name: customer_zip_code_prefix
        description: "First five digits of the customer zip code. Can be used to join to the geolocation table for geographic analysis."
      - name: customer_city
        description: "Name of the city where the customer is located."
      - name: customer_state
        description: "Two-letter abbreviation of the Brazilian state where the customer is located."

# -------------------------------------------------------
# Staging model: stg_olist__order_items
# -------------------------------------------------------
  - name: stg_olist__order_items
    description: "Staging model for order items. One row per item within an order. The combination of order_id and order_item_id forms the primary key."
    columns:
      - name: order_id
        description: "Foreign key to stg_olist__orders. Identifies which order this item belongs to."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: order_item_id
        description: "Sequential item number within an order. Starts at 1 for each order."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to stg_olist__products. Identifies the product being sold."
        tests:
          - not_null
      - name: seller_id
        description: "Foreign key to stg_olist__sellers. Identifies the seller fulfilling this item."
        tests:
          - not_null
      - name: shipping_limit_date
        description: "Date by which the seller must ship the item to meet the estimated delivery date."
        tests:
          - data_type:
              arguments:
                data_type: TIMESTAMP
      - name: price
        description: "Item price in Brazilian Real (BRL)."
      - name: freight_value
        description: "Freight cost for this item in Brazilian Real (BRL)."

# -------------------------------------------------------
# Staging model: stg_olist__products
# -------------------------------------------------------
  - name: stg_olist__products
    description: "Staging model for products. One row per product. Primary key is product_id. Note that product_category_name is in Portuguese and will be translated to English in the mart layer."
    columns:
      - name: product_id
        description: "Unique identifier for each product. Primary key of this model."
        tests:
          - not_null
          - unique
      - name: product_category_name
        description: "Product category name in Portuguese. Joined to the category translation table in the mart layer to produce English category names."
      - name: product_name_length
        description: "Character length of the product name. Renamed from product_name_lenght to correct the typo in the source data."
      - name: product_description_length
        description: "Character length of the product description. Renamed from product_description_lenght to correct the typo in the source data."
      - name: product_photos_qty
        description: "Number of product photos published by the seller."
      - name: product_weight_g
        description: "Product weight in grams."
      - name: product_length_cm
        description: "Product length in centimetres."
      - name: product_height_cm
        description: "Product height in centimetres."
      - name: product_width_cm
        description: "Product width in centimetres."

# -------------------------------------------------------
# Staging model: stg_olist__geolocation
# -------------------------------------------------------
  - name: stg_olist__geolocation
    description: "Staging model for Brazilian zip code geolocation data. This table has no true primary key — multiple coordinate pairs can exist for the same zip code prefix. Deduplication keeps one representative coordinate per zip code prefix. Use geolocation_zip_code_prefix to join to customer and seller tables."
    columns:
      - name: geolocation_zip_code_prefix
        description: "First five digits of a Brazilian zip code. Used as the join key to customer and seller tables. Not unique — multiple coordinates can exist per prefix, deduplicated to one row per prefix in this model."
        tests: 
          - not_null
      - name: geolocation_lat
        description: "Latitude coordinate for the zip code area."
      - name: geolocation_lng
        description: "Longitude coordinate for the zip code area."
      - name: geolocation_city
        description: "City name associated with the zip code prefix."
      - name: geolocation_state
        description: "Two-letter Brazilian state abbreviation associated with the zip code prefix."

# -------------------------------------------------------
# Staging model: stg_olist__orders
# -------------------------------------------------------
  - name: stg_olist__orders
    description: "Staging model for orders. One row per order. Primary key is order_id. Contains order status and all relevant timestamps across the order lifecycle."
    columns:
      - name: order_id
        description: "Unique identifier for each order. Primary key of this model."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_olist__customers. Identifies the customer who placed the order."
        tests:
          - not_null 
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        description: "Current status of the order. Possible values include delivered, shipped, canceled, unavailable, invoiced, processing, created, and approved."
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: order_purchase_timestamp
        description: "Timestamp when the order was placed by the customer."
        tests:
          - data_type:
              arguments:
                data_type: TIMESTAMP
      - name: order_approved_at
        description: "Timestamp when the payment for the order was approved."
        tests:
          - data_type:
              arguments:
                data_type: TIMESTAMP
      - name: order_delivered_carrier_date
        description: "Timestamp when the order was handed to the logistics carrier."
        tests:
          - data_type:
              arguments:
                data_type: TIMESTAMP
      - name: order_delivered_customer_date
        description: "Timestamp when the order was delivered to the customer."
        tests:
          - data_type:
              arguments:
                data_type: TIMESTAMP
      - name: order_estimated_delivery_date
        description: "Estimated delivery date communicated to the customer at time of purchase."
        tests:
          - data_type:
              arguments:
                data_type: TIMESTAMP

# -------------------------------------------------------
# Staging model: stg_olist__order_payments
# -------------------------------------------------------
  - name: stg_olist__order_payments
    description: "Staging model for order payments. One row per payment per order. A single order can have multiple payment methods, identified by payment_sequential. The combination of order_id and payment_sequential forms the primary key."
    columns:
      - name: order_id
        description: "Foreign key to stg_olist__orders. Identifies which order this payment belongs to."
        tests: 
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_olist__orders')
                field: order_id
      - name: payment_sequential
        description: "Sequential number identifying each payment method used within an order. Starts at 1. Cast from STRING to INT64 in staging."
      - name: payment_type
        description: "Payment method used. Possible values include credit_card, boleto, voucher, and debit_card."
      - name: payment_installments
        description: "Number of installments chosen by the customer for credit card payments. Cast from STRING to INT64 in staging."
      - name: payment_value
        description: "Transaction value for this payment in Brazilian Real (BRL). Cast from STRING to NUMERIC in staging."
    