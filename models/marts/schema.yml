version: 2

models:
# -------------------------------------------------------
# Mart model: dim_products
# -------------------------------------------------------
  - name: dim_products
    description: "Product dimension table. One row per product with English category names. Used to enrich fact tables with product attributes and enable category-level analysis."
    columns:
      - name: product_id
        description: "Unique identifier for each product. Primary key of this model."
        tests:
          - unique
          - not_null
      - name: product_category_name_english
        description: "English translation of the product category name. Null for two categories missing from the translation table — pc_gamer and portateis_cozinha_e_preparadores_de_alimentos."
        tests:
          - not_null:
              config:
                severity: warn
      - name: product_name_length
        description: "Character length of the product name."
      - name: product_description_length
        description: "Character length of the product description."
      - name: product_photos_qty
        description: "Number of product photos published by the seller."
      - name: product_weight_g
        description: "Product weight in grams."
      - name: product_length_cm
        description: "Product length in centimetres."
      - name: product_height_cm
        description: "Product height in centimetres."
      - name: product_width_cm
        description: "Product width in centimetres."

# -------------------------------------------------------
# Mart model: dim_sellers
# -------------------------------------------------------
  - name: dim_sellers
    description: "Seller dimension table. One row per seller. Contains seller location attributes used for geographic analysis and joining to order items."
    columns:
      - name: seller_id
        description: "Unique identifier for each seller. Primary key of this model."
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: "First five digits of the seller zip code."
      - name: seller_city
        description: "City where the seller is located."
      - name: seller_state
        description: "Two-letter Brazilian state abbreviation where the seller is located."

# -------------------------------------------------------
# Mart model: dim_customers
# -------------------------------------------------------
  - name: dim_customers
    description: "Customer dimension table. One row per order-customer relationship. Note that the same physical customer will have a different customer_id per order — use customer_unique_id to identify returning customers."
    columns:
      - name: customer_id
        description: "Unique identifier for each order-customer relationship. Primary key of this model."
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier for the physical customer across all orders. Use this to identify returning customers."
      - name: customer_zip_code_prefix
        description: "First five digits of the customer zip code."
      - name: customer_city
        description: "City where the customer is located."
      - name: customer_state
        description: "Two-letter Brazilian state abbreviation where the customer is located."

# -------------------------------------------------------
# Fact model: fct_orders
# -------------------------------------------------------
  - name: fct_orders
    description: "Fact table for orders. One row per order. Contains order status and lifecycle timestamps. Join to dim_customers for customer attributes, fct_order_items for revenue, and fct_order_payments for payment details."
    columns:
      - name: order_id
        description: "Unique identifier for each order. Primary key of this model."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_status
        description: "Current status of the order."
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: order_purchase_timestamp
        description: "Timestamp when the order was placed."
      - name: order_approved_at
        description: "Timestamp when the payment was approved."
      - name: order_delivered_carrier_date
        description: "Timestamp when the order was handed to the carrier."
      - name: order_delivered_customer_date
        description: "Timestamp when the order was delivered to the customer."
      - name: order_estimated_delivery_date
        description: "Estimated delivery date communicated to the customer."

# -------------------------------------------------------
# Fact model: fct_order_payments
# -------------------------------------------------------
  - name: fct_order_payments
    description: "Fact table for order payments. One row per payment per order. A single order can have multiple payment rows identified by payment_sequential."
    columns:
      - name: order_id
        description: "Foreign key to fct_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: payment_sequential
        description: "Sequential number identifying each payment method within an order."
        tests:
          - not_null
      - name: payment_type
        description: "Payment method used."
      - name: payment_installments
        description: "Number of installments chosen by the customer."
      - name: payment_value
        description: "Transaction value for this payment in Brazilian Real (BRL)."
        tests:
          - not_null
          - not_negative

# -------------------------------------------------------
# Fact model: fct_order_reviews
# -------------------------------------------------------
  - name: fct_order_reviews
    description: "Fact table for order reviews. One row per review. Contains customer satisfaction scores and optional written feedback submitted after order delivery."
    columns:
      - name: review_id
        description: "Unique identifier for each review. Primary key of this model."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: review_score
        description: "Customer satisfaction score between 1 and 5."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: review_comment_title
        description: "Optional title of the customer review. May be null."
      - name: review_comment_message
        description: "Optional body text of the customer review. May be null."
      - name: review_creation_date
        description: "Timestamp when the review form was sent to the customer."
      - name: review_answer_timestamp
        description: "Timestamp when the customer submitted the review."